name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sealcode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sealcode_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod
      # Shared runners are noisy: a missed latency target is a warning here, not a failure.
      - run: pnpm bench || echo "::warning::Added-latency target missed on the CI runner; re-run pnpm bench locally."

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        run: docker buildx build -f deploy/gateway.Dockerfile --platform linux/amd64 .
      - name: Build web image
        run: docker buildx build -f deploy/web.Dockerfile --platform linux/amd64 --build-arg SOURCE_COMMIT=${{ github.sha }} .
      - name: Build backup image
        run: docker buildx build -f deploy/backup/Dockerfile --platform linux/amd64 .
      - name: Validate the compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet
